name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish releases, which the in-app updater downloads

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests
        run: dotnet test tests/Vibra.Tests/Vibra.Tests.csproj -c Release

      - name: Build Vibra.exe
        run: dotnet build src/Vibra/Vibra.csproj -c Release -o out -p:Version=${{ env.VERSION }}

      - name: Smoke test (opens both windows, runs 15 s, no errors logged)
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA 'Vibra\vibra.log'
          $p = Start-Process -FilePath out\Vibra.exe -ArgumentList '--settings' -PassThru
          Start-Sleep -Seconds 15
          $exited = $p.HasExited
          if (-not $exited) {
            # Print the window's control layout, so layout problems are visible in the log.
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            $A = [System.Windows.Automation.AutomationElement]
            $byPid = New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $p.Id)
            $isWindow = New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Window)
            $both = New-Object System.Windows.Automation.AndCondition($byPid, $isWindow)
            $windows = @($A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Descendants, $both))
            if ($windows.Count -lt 2) { throw "Expected the main and settings windows, found $($windows.Count)" }
            foreach ($window in $windows) {
              Write-Host "Window: $($window.Current.Name) $($window.Current.BoundingRectangle)"
              foreach ($e in $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
                Write-Host ("  {0,-10} {1,-34} {2}" -f $e.Current.ControlType.ProgrammaticName.Replace('ControlType.', ''), $e.Current.Name, $e.Current.BoundingRectangle)
              }
            }

            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$PWD\screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
            Stop-Process -Id $p.Id -Force
          }
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'No log written' }
          if ($exited) { throw "Vibra exited early (code $($p.ExitCode))" }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern '\[ERROR\]' -Quiet)) { throw 'Errors were logged' }

      - uses: actions/upload-artifact@v4
        with:
          name: Vibra
          path: |
            out/Vibra.exe
            out/Vibra.exe.config

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore

      # Every green build of the default branch becomes a release; Vibra updates itself from the latest one.
      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          Set-Content -Path notes.md -Value $env:NOTES
          gh release create "v$env:VERSION" out/Vibra.exe out/Vibra.exe.config `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "Vibra $env:VERSION" --notes-file notes.md --latest
